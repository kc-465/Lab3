<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Stack Demo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-layout">
        <header class="header"><h1>HEADER</h1></header>
        <nav class="nav"><h2>NAVIGATION</h2></nav>
        <main class="main">
            <h2>MAIN CONTENT AREA</h2>
            <div class="card-master">
                <article class="card-first">
                    <p>Content Card 1</p>
                </article>
                <article class="card-other">
                    <p>Content Card 2</p>
                </article>
                <article class="card-other">
                    <p>Content Card 3</p>
                </article>
            </div>
        </main>
    </div>
    <footer class="footer">
        <h2>FOOTER</h2>
    </footer>
</body>
</html>
